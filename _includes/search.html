<div class="search-overlay" id="search-overlay" aria-hidden="true"
    data-search-json="{{ '/search.json' | relative_url }}">
    <div class="search-dialog" role="dialog" aria-modal="true" aria-label="站内搜索">
        <div class="search-bar">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round">
                <circle cx="11" cy="11" r="6.5"></circle>
                <path d="m20 20-3.8-3.8"></path>
            </svg>
            <label class="sr-only" for="search-input">搜索文章</label>
            <input id="search-input" type="search" placeholder="搜索标题、副标题或标签…" autocomplete="off"
                spellcheck="false">
            <button class="search-close" type="button" aria-label="关闭搜索">Esc</button>
        </div>
        <div id="search-results" class="search-results">
            <p class="search-hint">输入关键词，搜索标题、副标题或标签。</p>
        </div>
    </div>
</div>
