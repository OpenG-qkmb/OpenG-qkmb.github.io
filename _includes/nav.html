<a class="skip-link" href="#main">跳到正文</a>

<header class="site-nav" id="site-nav">
    <div class="nav-inner">
        <a class="nav-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>

        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links"
            aria-label="打开导航菜单">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-links" id="nav-links" aria-label="主导航">
            <a class="nav-link{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}">主页</a>
            {% for item in site.pages %}
                {% if item.title and item.hide-in-nav != true and item.url != '/' %}
                <a class="nav-link{% if page.url == item.url %} active{% endif %}"
                    href="{{ item.url | relative_url }}">{{ item.title }}</a>
                {% endif %}
            {% endfor %}
            <button class="nav-search" type="button" data-search-open aria-label="搜索文章" title="搜索（按 / 键）">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round">
                    <circle cx="11" cy="11" r="6.5"></circle>
                    <path d="m20 20-3.8-3.8"></path>
                </svg>
            </button>
        </nav>
    </div>
</header>
