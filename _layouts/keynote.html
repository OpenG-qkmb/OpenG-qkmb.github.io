---
layout: default
---

{% include intro-header.html type='keynote' %}

<div class="post-layout">
    <article class="post-body post-container prose" id="post-content">
        {{ content }}

        <footer class="post-foot">
            {% if page.tags %}
            <div class="post-foot-tags">
                {% for tag in page.tags %}
                <a class="tag" href="{{ '/archive/' | relative_url }}?tag={{ tag | url_encode }}">#{{ tag }}</a>
                {% endfor %}
            </div>
            {% endif %}
            {% include post-nav.html %}
        </footer>
    </article>
</div>

{% if page.mathjax %}{% include mathjax_support.html %}{% endif %}
