# ==========================================================================
# 站点设置
# ==========================================================================
title: 伞焕羌登怨
SEOTitle: 伞焕羌登怨的博客
header-img: img/home-bg.jpg
# email: radiumvs@foxmail.com
description: "博客 - 伞焕羌登怨"
keyword: "博客, 人类, 伞焕羌登怨, 神圣的言语, 哈儿, 哈儿实验室, 炼钢党"
url: "https://shqdy.cn"              # your host, for absolute URL
baseurl: ""                          # for example, '/blog' if your blog hosted on 'host/blog'

# 统一按 UTC 构建：本地预览与 GitHub Pages 对发布时间的解释一致，
# 标题栏配色凭据（标题 + 发布时间）也就不会因构建环境而变化。
timezone: UTC

# Publish posts or collection documents with a future date.
future: true


# ==========================================================================
# 标题栏（title bar）
# --------------------------------------------------------------------------
# 文章标题栏背景有两种来源：
#
# 1. 图片：在文章 front matter 里写 header-img（沿用旧模板写法），
#    例如 header-img: "img/7.jpg"；header-mask: 0.35 可再压暗一层。
#
# 2. 自动配色：不写 header-img 时，模板会由「标题 + 发布时间」算出唯一的
#    16 位十六进制凭据，再映射到固定色板（13 种纯色 + 5 种低对比渐变）。
#    色板全部为暖色/绿色系，不包含蓝紫，且已保证白色标题对比度 >= 5.2:1。
#    同一篇文章永远同色；不同文章按凭据均匀分布。算法见 js/header-color.js。
#
#    也可以显式指定：
#      header-style: color   # 强制自动配色（即使写了 header-img）
#      header-style: image   # 强制使用图片
#      header-style: text    # 兼容旧模板写法，等同 color
#
# 页面（layout: page）默认仍使用 site.header-img；写了 header-img 则用页面的图片。
# ==========================================================================
chrome-tab-theme-color: "#A4462A"


# ==========================================================================
# 构建设置
# ==========================================================================
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
highlighter: rouge
permalink: pretty
paginate: 15
exclude: ["less","node_modules","Gruntfile.js","package.json","README.md","README.zh.md","_deleted"]
anchorjs: true                       # kept for compatibility; the new theme auto-links headings


# ==========================================================================
# Gems
# ==========================================================================
# `$ gem install jekyll-paginate`
plugins: [jekyll-paginate]


# ==========================================================================
# Markdown 设置
# ==========================================================================
markdown: kramdown
kramdown:
  input: GFM                         # use Github Flavored Markdown
# 数学公式：文章正文出现 $...$ / $$...$$（或 kramdown 生成的 math/tex 脚本）时，
# 会自动加载 MathJax 3 并按 TeX 渲染；不需要在每篇文章里写开关。
# 如某篇文章需要关闭，可在 front matter 写 `mathjax: false`。
# 也可在站点级设置 `mathjax: true` 强制所有文章加载。


# ==========================================================================
# 侧栏（旧模板配置，新模板为单栏阅读布局，保留键位以兼容旧配置）
# ==========================================================================
sidebar: false
sidebar-about-description: "伞焕羌登怨"
sidebar-avatar: /img/qkmb.jpg        # use absolute URL, seeing it's used in both `/` and `/about/`


# ==========================================================================
# Featured Tags（保留供旧 include 使用）
# ==========================================================================
featured-tags: true
featured-condition-size: 1


# ==========================================================================
# Progressive Web Apps
# ==========================================================================
service-worker: true


# ==========================================================================
# MathJax rendering for layout:page (e.g. post preview)
# ==========================================================================
page-mathjax: false


